<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      .og {
        position: relative;
        width: 1200px;
        height: 630px;
        background: #0a0a0a;
        overflow: hidden;
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        color: #fafafa;
      }
      .row {
        position: absolute;
        left: 96px;
        top: 200px;
        display: flex;
        align-items: center;
        gap: 44px;
      }
      .mark {
        width: 180px;
        height: 180px;
        object-fit: cover;
        flex: none;
      }
      h1 {
        font-size: 118px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -4px;
      }
      .desc {
        margin-top: 20px;
        font-size: 40px;
        font-weight: 600;
        color: #a3a3a3;
        letter-spacing: -0.5px;
      }
      .foot {
        position: absolute;
        left: 96px;
        bottom: 56px;
        font-family: "JetBrains Mono", monospace;
        font-size: 26px;
        color: #6b6b6b;
      }
    </style>
  </head>
  <body>
    <div class="og" role="img" aria-label="Takos OG">
      <div class="row">
        <img class="mark" src="../public/logo.png" alt="" />
        <div>
          <h1>Takos</h1>
          <div class="desc">Self-hosted chat &amp; agent workspace.</div>
        </div>
      </div>
      <div class="foot">AGPL-3.0 · github.com/tako0614/takos · takos.jp</div>
    </div>
  </body>
</html>
