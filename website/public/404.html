<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark" />
    <title>ページが見つかりません | Takos</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #09090b;
        color: #fafafa;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN',
          'Yu Gothic UI', 'Segoe UI', Roboto, sans-serif;
      }
      main { max-width: 30rem; }
      img {
        width: 48px;
        height: 48px;
        border-radius: 10px;
        display: block;
        margin-bottom: 1.5rem;
      }
      .code {
        font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace;
        font-size: 0.8rem;
        color: #71717a;
        letter-spacing: 0.08em;
      }
      h1 {
        font-size: 1.35rem;
        font-weight: 600;
        margin: 0.5rem 0 0.7rem;
      }
      p {
        color: #a1a1aa;
        font-size: 0.92rem;
        line-height: 1.75;
      }
      a {
        display: inline-block;
        margin-top: 1.4rem;
        color: #fafafa;
        font-size: 0.92rem;
        text-decoration: underline;
        text-underline-offset: 4px;
        text-decoration-color: #3f3f46;
      }
      a:hover { color: #53c1f0; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="" />
      <p class="code">404</p>
      <h1>ページが見つかりません</h1>
      <p>URL が変わったか、ページが移動した可能性があります。</p>
      <a href="/">トップへ戻る</a>
    </main>
  </body>
</html>
