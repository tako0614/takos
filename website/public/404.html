<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light" />
    <title>ページが見つかりません | Takos</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #00a0e4;
        color: #16120e;
        font-family:
          'Bricolage Grotesque Variable', 'Bricolage Grotesque', -apple-system,
          BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI',
          'Segoe UI', Roboto, sans-serif;
      }
      .card {
        background: #fdfcf8;
        border: 4px solid #16120e;
        box-shadow: 10px 10px 0 rgba(22, 18, 14, 0.9);
        padding: 2.6rem 3rem;
        max-width: 34rem;
      }
      .code {
        font-family: 'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, monospace;
        font-size: 0.85rem;
        color: #ed1b24;
        letter-spacing: 0.08em;
      }
      h1 {
        font-size: 1.6rem;
        font-weight: 700;
        margin: 0.6rem 0 0.8rem;
      }
      p {
        color: #4a4237;
        line-height: 1.7;
      }
      a {
        display: inline-block;
        margin-top: 1.4rem;
        background: #ed1b24;
        color: #fdfcf8;
        font-weight: 700;
        padding: 0.7em 1.4em;
        text-decoration: none;
        border: 3px solid #16120e;
        box-shadow: 4px 4px 0 #16120e;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="code">404</span>
      <h1>ページが見つかりません</h1>
      <p>URL を確認するか、トップページから移動してください。</p>
      <a href="/">Takos トップへ</a>
    </div>
  </body>
</html>
