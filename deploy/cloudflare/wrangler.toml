## OSS-safe deployment template.
## Replace placeholder domains, account IDs, namespace IDs, and resource IDs
## before deploying.
##
## DIRECT CLOUDFLARE ADAPTER: ../product-resources.json is the provider-neutral
## product authority. The OpenTofu module at ../opentofu/cloudflare maps that
## contract to Cloudflare durable infrastructure and publishes
## the non-secret endpoints / binding map. This wrangler.toml is the
## WORKER-ARTIFACT HALF of that direct adapter: the worker script
## entry, ASSETS, container images, Durable Object migrations, routes, and binding
## wiring the OpenTofu provider cannot express. It reads the module outputs and
## must stay in sync with the module; it is not a competing source of truth for
## durable infra or a product-only deploy authority.
## See ../../docs/architecture/internal-trust-boundaries.md for the deploy invariant.

# NOTE: all relative paths in this file resolve from THIS config file's
# directory (takos/deploy/cloudflare/), per wrangler semantics.
name = "takos"
# Account authority is supplied by the selected Provider Connection/operator
# environment; this portable artifact config never pins an account.
main = "../../src/worker/cloudflare-entrypoint.ts"
workers_dev = true
compatibility_date = "2026-04-01"
# Takos consumes Takosumi Accounts over its public OIDC origin. Cloudflare
# otherwise sends Worker-to-Worker global fetches to the zone origin and skips
# the target Worker, so managed WfP deployments would time out during OIDC
# discovery. The public-fetch behavior also matches non-Cloudflare targets.
compatibility_flags = ["nodejs_compat", "no_handle_cross_request_promise_resolution", "global_fetch_strictly_public"]

[alias]
"node:sqlite" = "../../src/worker/cloudflare/node-sqlite-unavailable.ts"

# Single public hostname for the Takos product worker. Takosumi owns the
# account/control-plane origin that installs this Worker as a normal Capsule;
# this Worker is an OIDC client/resource server, not its own Takosumi issuer.
# custom_domain provisions the DNS record + TLS cert automatically on deploy.
# [[routes]]
# pattern = "app.your-domain.example"
# custom_domain = true

[observability]
enabled = true

[observability.logs]
head_sampling_rate = 0.1

[vars]
# Non-sensitive configuration only. Replace the example.* placeholders with the
# self-hoster's own hostname.
ADMIN_DOMAIN = "app.your-domain.example"
TENANT_BASE_DOMAIN = "app.your-domain.example"
AUTH_PUBLIC_BASE_URL = "https://app.your-domain.example"
PROXY_BASE_URL = "https://app.your-domain.example"
TAKOS_AGENT_CONTROL_RPC_BASE_URL = "https://app.your-domain.example"
# Remote-tool allowlist for the agent runtime. The agent container fails closed
# when this is empty, so the bundled distribution defaults to "*" (the current
# policy-filtered Takos + installed Capsule + registered MCP catalog). Narrow
# it to a comma-separated list (e.g. "web_fetch,create_artifact") to restrict which
# tools the agent may call. Leave unset to keep the all-tools default.
# TAKOS_AGENT_TOOL_ALLOWLIST = "*"
# OIDC redirect/return-to targets are validated from server-managed config:
# redirect_uri is checked against the per-client redirectUris allowlist
# (auth/oidc.ts) and return_to is constrained by sanitizeReturnTo
# (auth/provisioning.ts). No separate domain-allowlist env var is consumed.
# Takosumi Accounts / control-plane endpoint. Takos consumes this external
# origin for OIDC and Capsule projection APIs. Set TAKOSUMI_ACCOUNTS_TOKEN as a
# secret when server-to-server Capsule install/projection calls are enabled.
TAKOSUMI_ACCOUNTS_URL = "https://app.takosumi.example"
OIDC_ISSUER_URL = "https://app.takosumi.example"
OIDC_CLIENT_ID = "takos-worker-installation-client"
OIDC_REDIRECT_URI = "https://app.your-domain.example/auth/oidc/callback"
EXECUTOR_TIER1_WARM_POOL_SIZE = "1"
EXECUTOR_TIER1_MAX_CONCURRENT_RUNS = "4"
EXECUTOR_TIER3_POOL_SIZE = "1"
EXECUTOR_TIER3_MAX_CONCURRENT_RUNS = "1"
# OCI deployment adapter for image-backed services / containers.
OCI_ORCHESTRATOR_URL = ""
CF_ACCOUNT_ID = "replace-with-account-id"
CF_ZONE_ID = "replace-with-zone-id"

[triggers]
crons = ["3,18,33,48 * * * *", "5 * * * *"]

# IMPORTANT: The following sensitive values must be set via `wrangler secret put`:
# - OIDC_CLIENT_SECRET: optional Takosumi Accounts OIDC client secret for a
#   confidential OIDC client; public PKCE clients omit it
# - TAKOSUMI_ACCOUNTS_TOKEN: optional server-to-server Capsule API token
# Static assets (routed through Worker for hostname-based routing)
[assets]
directory = "../../dist"
binding = "ASSETS"
run_worker_first = true

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "takos-control-db"
database_id = "replace-with-d1-database-id"
migrations_dir = "../../db/migrations-control/migrations"

# KV for hostname routing
[[kv_namespaces]]
binding = "HOSTNAME_ROUTING"
id = "replace-with-hostname-routing-kv-namespace-id"

# Durable Objects
[[durable_objects.bindings]]
name = "SESSION_DO"
class_name = "SessionDO"

[[durable_objects.bindings]]
name = "RUN_NOTIFIER"
class_name = "RunNotifierDO"

[[durable_objects.bindings]]
name = "NOTIFICATION_NOTIFIER"
class_name = "NotificationNotifierDO"

# Distributed rate limiting (optional - falls back to in-memory if not configured)
[[durable_objects.bindings]]
name = "RATE_LIMITER_DO"
class_name = "RateLimiterDO"

[[durable_objects.bindings]]
name = "ROUTING_DO"
class_name = "RoutingDO"

[[durable_objects.bindings]]
name = "EXECUTOR_CONTAINER"
class_name = "ExecutorContainerTier1"

[[durable_objects.bindings]]
name = "EXECUTOR_CONTAINER_TIER2"
class_name = "ExecutorContainerTier2"

[[durable_objects.bindings]]
name = "EXECUTOR_CONTAINER_TIER3"
class_name = "ExecutorContainerTier3"

# Durable Object lifecycle. Existing app/session/notifier classes are
# KV-backed Durable Objects and must keep their historical migration shape.
# Container-backed Durable Objects are the only SQLite classes here; Cloudflare
# cannot convert an already-deployed class from KV-backed storage to SQLite.
[[migrations]]
tag = "v1"
new_classes = ["SessionDO"]

[[migrations]]
tag = "v2"
new_classes = ["RunNotifierDO"]

[[migrations]]
tag = "v3"
new_classes = ["RateLimiterDO"]

[[migrations]]
tag = "v4"
new_classes = ["NotificationNotifierDO"]

[[migrations]]
tag = "v5"
new_classes = ["RoutingDO"]

[[migrations]]
tag = "v6"
new_sqlite_classes = [
  "TakosRuntimeContainer",
  "ExecutorContainerTier1",
  "ExecutorContainerTier2",
  "ExecutorContainerTier3",
]

[[migrations]]
tag = "v7"
deleted_classes = ["TakosRuntimeContainer"]

# Agent images build from the ecosystem source checkout. image /
# image_build_context are wrangler-config-relative (resolved from
# takos/deploy/cloudflare). Release installs replace these paths with reviewed
# Cloudflare registry refs; source builds require sibling takos-agent-engine.
[[containers]]
class_name = "ExecutorContainerTier1"
image = "../../containers/agent/Dockerfile"
image_build_context = "../../../"
instance_type = "lite"
max_instances = 1
rollout_active_grace_period = 900

[[containers]]
class_name = "ExecutorContainerTier2"
image = "../../containers/agent/Dockerfile"
image_build_context = "../../../"
instance_type = "basic"
max_instances = 1
rollout_active_grace_period = 900

[[containers]]
class_name = "ExecutorContainerTier3"
image = "../../containers/agent/Dockerfile"
image_build_context = "../../../"
instance_type = { vcpu = 1, memory_mib = 12288, disk_mb = 4000 }
max_instances = 1
rollout_active_grace_period = 900

# R2 Bucket for worker bundles (optional - for production)
[[r2_buckets]]
binding = "WORKER_BUNDLES"
bucket_name = "takos-worker-bundles"

# R2 Bucket for tenant custom workers
[[r2_buckets]]
binding = "TENANT_BUILDS"
bucket_name = "takos-tenant-builds"

# R2 Bucket for tenant source code
[[r2_buckets]]
binding = "TENANT_SOURCE"
bucket_name = "takos-tenant-source"

# R2 Bucket for Git store objects (blobs, trees, commits)
[[r2_buckets]]
binding = "GIT_OBJECTS"
bucket_name = "takos-git-objects"

# R2 Bucket for offloading hot D1 bulk data (RunEvent JSONL, large Messages, Usage raw)
[[r2_buckets]]
binding = "TAKOS_OFFLOAD"
bucket_name = "takos-offload"

# Secrets (set via wrangler secret put):
# Authentication:
# - OIDC_CLIENT_SECRET: optional Takosumi Accounts OIDC client secret for a
#   confidential OIDC client; public PKCE clients omit it
#
# Runtime secrets required at boot. The Worker answers 503 on every path except
# /health until they exist. deploy/opentofu/cloudflare names them and holds no
# value; generate them with `bun run generate:keys`. See docs/deploy/runtime-secrets.md.
# - ENCRYPTION_KEY: AES-256-GCM master secret. A 64-character value is hex
#   decoded into 32 bytes before PBKDF2-SHA256; any other length is used as a
#   UTF-8 passphrase. The two encodings derive different keys, so a value cannot
#   be re-encoded after data has been written.
# - TAKOS_INTERNAL_API_SECRET: opaque shared secret compared in constant time
#   against the X-Takos-Internal-Secret header on /internal/*.
#
# Platform keys:
# - PLATFORM_PRIVATE_KEY: RSA-2048 PKCS#8 PEM. Signs the short-lived
#   runtime-service JWT with RS256 through jose.importPKCS8.
# - PLATFORM_PUBLIC_KEY: the matching RSA-2048 SPKI PEM.
#
# Agent container start:
# - TAKOS_AGENT_START_TOKEN: Bearer credential used only for the private
#   executor-host -> agent-container /start request. Agent control RPC uses a
#   separate per-run random token and scope.
#
# OCI deployment adapter:
# - OCI_ORCHESTRATOR_TOKEN: optional auth token for image-backed services /
#   containers when the orchestrator requires it.
#
# Cloudflare API:
# - CF_API_TOKEN: optional Cloudflare API token for Workers-for-Platforms
#   workload deployment when that backend is explicitly enabled.
#
# Takosumi Accounts API:
# - TAKOSUMI_ACCOUNTS_TOKEN: optional server-to-server Capsule API token issued
#   by the external Takosumi control plane.

# BEGIN generated queue topology
# Generated by scripts/generate-queue-topology.ts from
# scripts/queue-consumer-contract.ts. Do not edit between the markers.

[[queues.producers]]
queue = "takos-runs"
binding = "RUN_QUEUE"

[[queues.producers]]
queue = "takos-index-jobs"
binding = "INDEX_QUEUE"

[[queues.producers]]
queue = "takos-notification-push"
binding = "TAKOS_NOTIFICATION_PUSH_QUEUE"

[[queues.consumers]]
queue = "takos-runs"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 5
max_concurrency = 5
retry_delay = 5
dead_letter_queue = "takos-runs-dlq"

[[queues.consumers]]
queue = "takos-runs-dlq"
max_batch_size = 10
max_batch_timeout = 60
max_retries = 100
max_concurrency = 5
retry_delay = 5

[[queues.consumers]]
queue = "takos-index-jobs"
max_batch_size = 5
max_batch_timeout = 60
max_retries = 2
max_concurrency = 5
retry_delay = 5
dead_letter_queue = "takos-index-jobs-dlq"

[[queues.consumers]]
queue = "takos-index-jobs-dlq"
max_batch_size = 10
max_batch_timeout = 60
max_retries = 100
max_concurrency = 5
retry_delay = 5

[[queues.consumers]]
queue = "takos-notification-push"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 5
max_concurrency = 5
retry_delay = 5
dead_letter_queue = "takos-notification-push-dlq"

[[queues.consumers]]
queue = "takos-notification-push-dlq"
max_batch_size = 10
max_batch_timeout = 60
max_retries = 100
max_concurrency = 5
retry_delay = 600

# END generated queue topology

# Vectorize for semantic search
[[vectorize]]
binding = "VECTORIZE"
index_name = "takos-embeddings"

# AI for embeddings
[ai]
binding = "AI"

# Internal service bindings
[[services]]
binding = "TAKOS_EGRESS"
service = "takos"
entrypoint = "TakosEgressEntrypoint"

[env.staging]
